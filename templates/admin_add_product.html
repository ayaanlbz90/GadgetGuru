{% extends "admin_base.html" %}
{% block title %}Upload New Product — GadgetGuru Admin{% endblock %}

{% block admin_content %}
<div class="admin-header"><h1>Upload New Product</h1></div>

<div class="panel" style="max-width:640px;">
  <form method="post" enctype="multipart/form-data">
    <div class="field">
      <label>Product Image</label>
      <label class="file-drop" id="fileDrop" for="productImageInput">
        <div>Click to upload an image (PNG, JPG, WEBP)</div>
      </label>
      <input type="file" id="productImageInput" name="image" accept="image/*" style="display:none;">
    </div>
    <div class="field">
      <label for="name">Product Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="price">Price (₹)</label>
        <input type="number" id="price" name="price" step="0.01" min="0" required>
      </div>
      <div class="field">
        <label for="stock">Stock Quantity</label>
        <input type="number" id="stock" name="stock" min="0" value="10">
      </div>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <input type="text" id="category" name="category" placeholder="e.g. Audio, Wearables, Accessories">
    </div>
    <button type="submit" class="btn btn-primary">Publish Product</button>
  </form>
</div>
{% endblock %}
