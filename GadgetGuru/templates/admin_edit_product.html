{% extends "admin_base.html" %}
{% block title %}Edit Product — GadgetGuru Admin{% endblock %}

{% block admin_content %}
<div class="admin-header"><h1>Edit Product</h1></div>

<div class="panel" style="max-width:640px;">
  <form method="post" enctype="multipart/form-data">
    <div class="field">
      <label>Product Image</label>
      <label class="file-drop" id="fileDrop" for="productImageInput">
        {% if product['image_filename'] %}
        <img src="{{ url_for('static', filename='uploads/' + product['image_filename']) }}" alt="{{ product['name'] }}">
        <p>Click to replace image</p>
        {% else %}
        <div>Click to upload an image (PNG, JPG, WEBP)</div>
        {% endif %}
      </label>
      <input type="file" id="productImageInput" name="image" accept="image/*" style="display:none;">
    </div>
    <div class="field">
      <label for="name">Product Name</label>
      <input type="text" id="name" name="name" value="{{ product['name'] }}" required>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4">{{ product['description'] }}</textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="price">Price (₹)</label>
        <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product['price'] }}" required>
      </div>
      <div class="field">
        <label for="stock">Stock Quantity</label>
        <input type="number" id="stock" name="stock" min="0" value="{{ product['stock'] }}">
      </div>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <input type="text" id="category" name="category" value="{{ product['category'] or '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>
{% endblock %}
